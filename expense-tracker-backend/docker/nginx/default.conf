# Define one web server
server {
    # Listen on port 80 inside the container (we map it to 8000 on your PC later)
    listen 80;

    # Default file to serve
    index index.php;

    # Laravel only exposes the "public" folder to the web
    root /var/www/html/public;

    # For any URL: try a real file, then a folder, otherwise send it to Laravel's index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # For any URL ending in .php, pass the request to the PHP container
    location ~ \.php$ {
        # "backend" is the service name in docker-compose, 9000 is the PHP-FPM port
        fastcgi_pass backend:9000;
        # Default PHP file
        fastcgi_index index.php;
        # Load Nginx's standard FastCGI settings
        include fastcgi_params;
        # Tell PHP-FPM the full path of the script to run
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}